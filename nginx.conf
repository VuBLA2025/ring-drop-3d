server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Preserve HTTPS scheme behind reverse proxies (Traefik/Dokploy/Cloudflare)
    absolute_redirect off;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|mjs|css|png|jpg|svg|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }
}
